name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"; exit 1; }
      - name: Package
        run: npx --yes @vscode/vsce@latest package
      - name: Create GitHub release with the VSIX attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" ./*.vsix \
            --verify-tag \
            --title "Agent Keep-Awake ${GITHUB_REF_NAME}" \
            --notes "Install: download the .vsix below, then run \`code --install-extension $(ls *.vsix)\` (or Extensions view → … → Install from VSIX…). See the [usage guide](https://apkola29.github.io/agent-keep-awake/usage.html) and the [changelog](https://github.com/apkola29/agent-keep-awake/blob/main/CHANGELOG.md)."
